[package]
name = "cerrojo"
version = "0.4.0"
edition = "2024"
description = "Bloquea en el celular las apps de reels y video vertical; solo el PC las desbloquea"
license = "MIT"
repository = "https://github.com/sthifen/cerrojo"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_6"] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rsa = { version = "0.9.8", features = ["sha2"] }
sha2 = "0.10.9"
crc32fast = "1.4.2"
rand = "0.8.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.20"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
